<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <!-- Left bar -->
  <g>
    <rect x="10" y="40" width="140" height="450" rx="38" fill="#000"/>
    <rect x="60" y="90" width="30" height="190" rx="15" fill="#fff"/>
    <rect x="30" y="400" width="90" height="55" rx="10" fill="#fff"/>
  </g>

  <!-- Middle bar -->
  <g>
    <rect x="110" y="40" width="170" height="450" rx="28" fill="#000"/>
    <rect x="160" y="25" width="95" height="370" rx="18" fill="#fff"/>
    <rect x="195" y="90" width="30" height="190" rx="15" fill="#000"/>
    <rect x="160" y="400" width="95" height="55" rx="8" fill="#000"/>
  </g>

  <!-- Right tilted bar -->
  <g transform="rotate(-10 390 255)">
    <rect x="320" y="55" width="110" height="420" rx="30" fill="#000"/>
    <rect x="345" y="85" width="60" height="285" rx="15" fill="#fff"/>
    <rect x="365" y="120" width="28" height="150" rx="14" fill="#000"/>
    <rect x="345" y="360" width="60" height="60" rx="8" fill="#000"/>
  </g>

</svg>